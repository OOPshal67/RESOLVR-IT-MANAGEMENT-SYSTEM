<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile & Settings')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('profile')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar('PROFILE & ACCOUNT SETTINGS')}"></header>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="overview-container text-center">
                        <div class="avatar-circle mx-auto mb-3" style="width:64px;height:64px;font-size:22px;"
                             th:text="${profileUser.initials}"></div>
                        <h5 class="fw-bold mb-1" th:text="${profileUser.fullName}"></h5>
                        <p class="text-secondary small mb-2" th:text="${profileUser.email}"></p>
                        <span class="badge bg-primary" th:text="${profileUser.role.displayName}"></span>
                        <hr>
                        <div class="text-start small">
                            <div class="d-flex justify-content-between py-1">
                                <span class="text-secondary">Role ID Code:</span>
                                <strong th:text="${profileUser.roleIdentifierCode}"></strong>
                            </div>
                            <div class="d-flex justify-content-between py-1">
                                <span class="text-secondary">Department:</span>
                                <strong th:text="${profileUser.department}"></strong>
                            </div>
                            <div class="d-flex justify-content-between py-1">
                                <span class="text-secondary">Status:</span>
                                <span class="badge bg-success" th:if="${profileUser.active}">Active</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="overview-container">
                        <div class="section-accent-header">
                            <div class="section-accent-title">Update Personal Information</div>
                        </div>
                        <form th:action="@{/profile}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Username (Immutable)</label>
                                    <input type="text" class="form-control bg-light" th:value="${profileUser.username}" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small" for="fullName">Full Name</label>
                                    <input type="text" name="fullName" class="form-control" th:value="${profileUser.fullName}" required id="fullName">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small" for="email">Email Address</label>
                                    <input type="email" name="email" class="form-control" th:value="${profileUser.email}" required id="email">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small" for="department">Department</label>
                                    <input type="text" name="department" class="form-control" th:value="${profileUser.department}" required id="department">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small" for="phone">Phone / Extension</label>
                                    <input type="text" name="phone" class="form-control" th:value="${profileUser.phone}" id="phone">
                                </div>
                            </div>
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary px-4">Save Profile Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
