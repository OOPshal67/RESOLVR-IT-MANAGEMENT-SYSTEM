<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset password')}"></head>
<body class="access-page">
<aside th:replace="~{fragments/access :: panel}"></aside>
<main class="access-main"><div class="access-card">
<button type="button" class="theme-link" data-theme>Dark mode</button>
<h1>Reset password</h1>
<p>Contact your service desk to verify your identity and get a recovery code. The code expires in 15 minutes.</p>
<form method="post" th:action="@{/forgot-password}"><label>Recovery code<input name="token" autocomplete="one-time-code" required></label><label>Password (12 or more characters)<input type="password" name="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><button class="action">Set password</button></form><a th:href="@{/login}">Back to sign in</a>
</div></main></body></html>
