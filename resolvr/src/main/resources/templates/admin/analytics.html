<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reports & Analytics')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('admin-analytics')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Reports and analytics')}"></header>
        <main class="app-content">
            <div class="overview-container mb-4">
                <div class="section-accent-header">
                    <div class="section-accent-title">SLA performance</div>
                    <a th:href="@{/admin/analytics/export.csv}" class="btn btn-primary btn-sm px-3">
                        <i class="bi bi-file-earmark-spreadsheet me-1"></i> Export Full CSV Report
                    </a>
                </div>


                <div class="kpi-pastel-grid">
                    <div class="kpi-pastel-card blue">
                        <div class="kpi-icon-box text-primary"><i class="bi bi-collection"></i></div>
                        <div>
                            <div class="kpi-label">Total Incidents</div>
                            <div class="kpi-value" th:text="${stats.totalIncidents}"></div>
                        </div>
                    </div>
                    <div class="kpi-pastel-card amber">
                        <div class="kpi-icon-box text-warning"><i class="bi bi-folder2-open"></i></div>
                        <div>
                            <div class="kpi-label">Open Incidents</div>
                            <div class="kpi-value" th:text="${stats.openIncidents}"></div>
                        </div>
                    </div>
                    <div class="kpi-pastel-card purple">
                        <div class="kpi-icon-box text-danger"><i class="bi bi-fire"></i></div>
                        <div>
                            <div class="kpi-label">P1 Critical / P2 High</div>
                            <div class="kpi-value" th:text="${stats.criticalIncidents + ' / ' + stats.highPriorityIncidents}"></div>
                        </div>
                    </div>
                    <div class="kpi-pastel-card green">
                        <div class="kpi-icon-box text-success"><i class="bi bi-shield-check"></i></div>
                        <div>
                            <div class="kpi-label">SLA Compliance</div>
                            <div class="kpi-value" th:text="${stats.slaComplianceRate + '%'}"></div>
                        </div>
                    </div>
                </div>


                <div class="analytics-2x2-grid">
                    <div class="metric-panel-card">
                        <div class="metric-panel-header">
                            <span class="dot-indicator" style="background-color:#2563EB;"></span>
                            <span>INCIDENTS BY CATEGORY</span>
                        </div>
                        <canvas id="categoryChart" height="190"></canvas>
                    </div>
                    <div class="metric-panel-card">
                        <div class="metric-panel-header">
                            <span class="dot-indicator" style="background-color:#EA580C;"></span>
                            <span>INCIDENTS BY AFFECTED IT SERVICE</span>
                        </div>
                        <canvas id="serviceChart" height="190"></canvas>
                    </div>
                    <div class="metric-panel-card">
                        <div class="metric-panel-header">
                            <span class="dot-indicator" style="background-color:#16A34A;"></span>
                            <span>TECHNICIAN ACTIVE WORKLOAD</span>
                        </div>
                        <canvas id="workloadChart" height="190"></canvas>
                    </div>
                    <div class="metric-panel-card">
                        <div class="metric-panel-header">
                            <span class="dot-indicator" style="background-color:#7C3AED;"></span>
                            <span>PRIORITY DISTRIBUTION (P1 - P4)</span>
                        </div>
                        <canvas id="priorityChart" height="190"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
    const catLabels = /*[[${categoryLabels}]]*/ [];
    const catValues = /*[[${categoryValues}]]*/ [];
    const srvLabels = /*[[${serviceLabels}]]*/ [];
    const srvValues = /*[[${serviceValues}]]*/ [];
    const wkLabels = /*[[${workloadLabels}]]*/ [];
    const wkValues = /*[[${workloadValues}]]*/ [];
    const pData = [
        /*[[${stats.criticalIncidents}]]*/ 4,
        /*[[${stats.highPriorityIncidents}]]*/ 5,
        /*[[${stats.mediumPriorityIncidents}]]*/ 3,
        /*[[${stats.lowPriorityIncidents}]]*/ 4
    ];

    new Chart(document.getElementById('categoryChart'), {
        type: 'bar',
        data: { labels: catLabels, datasets: [{ label: 'Incidents', data: catValues, backgroundColor: '#2563EB', borderRadius: 6 }] },
        options: { plugins: { legend: { display: false } } }
    });

    new Chart(document.getElementById('serviceChart'), {
        type: 'bar',
        data: { labels: srvLabels, datasets: [{ label: 'Incidents', data: srvValues, backgroundColor: '#0D9488', borderRadius: 6 }] },
        options: { indexAxis: 'y', plugins: { legend: { display: false } } }
    });

    new Chart(document.getElementById('workloadChart'), {
        type: 'bar',
        data: { labels: wkLabels, datasets: [{ label: 'Active Incidents', data: wkValues, backgroundColor: '#7C3AED', borderRadius: 6 }] },
        options: { plugins: { legend: { display: false } } }
    });

    new Chart(document.getElementById('priorityChart'), {
        type: 'doughnut',
        data: {
            labels: ['P1 Critical', 'P2 High', 'P3 Medium', 'P4 Low'],
            datasets: [{ data: pData, backgroundColor: ['#DC2626', '#EA580C', '#F59E0B', '#16A34A'] }]
        }
    });
</script>
</body>
</html>
