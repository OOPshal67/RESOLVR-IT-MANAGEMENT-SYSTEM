<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('SLA Policies Configuration')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('admin-sla')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar('SERVICE LEVEL AGREEMENT (SLA) POLICIES')}"></header>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <div class="overview-container mb-4">
                <div class="section-accent-header">
                    <div class="section-accent-title">Configurable 24/7 SLA Response &amp; Resolution Targets</div>
                    <span class="period-pill">Spring Scheduler Active</span>
                </div>
                <div class="table-responsive">
                    <table class="resolvr-table">
                        <thead>
                        <tr>
                            <th>Priority</th>
                            <th>Policy Name</th>
                            <th>Response Target (Mins)</th>
                            <th>Resolution Target (Mins)</th>
                            <th>Warning Threshold (%)</th>
                            <th>Auto-Escalation</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${slaPolicies}">
                            <td><span class="badge" th:style="'background-color:' + ${p.priorityLevel.hexColor}" th:text="${p.priorityLevel.label}"></span></td>
                            <td class="fw-semibold" th:text="${p.policyName}"></td>
                            <td colspan="5">
                                <form th:action="@{/admin/sla/{id}(id=${p.id})}" method="post" class="row g-2 align-items-center">
                                    <div class="col-md-3">
                                        <input type="number" name="responseTargetMinutes" class="form-control form-control-sm" min="1" th:value="${p.responseTargetMinutes}" required>
                                    </div>
                                    <div class="col-md-3">
                                        <input type="number" name="resolutionTargetMinutes" class="form-control form-control-sm" min="5" th:value="${p.resolutionTargetMinutes}" required>
                                    </div>
                                    <div class="col-md-2">
                                        <input type="number" name="warningThresholdPercent" class="form-control form-control-sm" min="5" max="90" th:value="${p.warningThresholdPercent}" required>
                                    </div>
                                    <div class="col-md-2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="escalationEnabled" value="true" th:checked="${p.escalationEnabled}">
                                            <label class="form-check-label small">Enabled</label>
                                        </div>
                                    </div>
                                    <div class="col-md-2">
                                        <button type="submit" class="btn btn-sm btn-primary w-100">Update</button>
                                    </div>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
