<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="overview-container text-center p-5">
                <div class="display-4 fw-bold text-danger mb-2" th:text="${statusCode ?: 400}"></div>
                <h4 class="fw-bold mb-3" th:text="${errorTitle ?: 'Request could not be completed'}"></h4>
                <p class="text-secondary mb-4" th:text="${errorMessage ?: 'Return to your workspace to continue.'}"></p>
                <a th:href="@{/}" class="btn btn-primary px-4">
                    <i class="bi bi-arrow-left me-1"></i> Return to Workspace
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
