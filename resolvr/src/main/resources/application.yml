spring:
  profiles:
    default: dev
  application:
    name: RESOLVR
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resolvr_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 32
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 60m
      cookie:
        secure: ${COOKIE_SECURE:true}
        http-only: true
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operationsSorter: method

resolvr:
  sla:
    warning-threshold-percent: 25
    scheduler-interval-ms: 60000
  duplicate:
    similarity-threshold: 0.35
  assignment:
    default-strategy: SKILL_BASED
  priority:
    default-strategy: WEIGHTED_SCORE
  escalation:
    enabled: true
