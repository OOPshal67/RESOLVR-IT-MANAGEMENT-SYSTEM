services:
  postgres:
    image: postgres:16-alpine
    container_name: resolvr-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-resolvr_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - resolvr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-resolvr_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  resolvr-app:
    build: .
    container_name: resolvr-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-resolvr_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SERVER_PORT: 8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
    volumes:
      - resolvr_demo:/app/dev-credentials
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8080:8080"

volumes:
  resolvr_demo:
  resolvr_pgdata:
